version: "3.9"

services:
  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: whatsfrt_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whatsfrt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whatsfrt}
      POSTGRES_DB: ${POSTGRES_DB:-whatsfrt}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whatsfrt}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: whatsfrt_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Evolution API ────────────────────────────────────────────────────────
  evolution_api:
    image: atendai/evolution-api:v2.2.3
    container_name: whatsfrt_evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      # Sinaliza ao script de startup para usar as variáveis do container diretamente
      DOCKER_ENV: "true"

      # Servidor
      SERVER_TYPE: http
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8080}

      # Autenticação
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-whatsfrt-secret-key}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"

      # Cache de sessão WhatsApp via Redis
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_TTL: "604800"
      CACHE_REDIS_SAVE_INSTANCES: "true"

      # Webhook para receber eventos no Next.js
      WEBHOOK_GLOBAL_URL: ${EVOLUTION_WEBHOOK_URL:-http://host.docker.internal:3000/api/webhooks/evolution}
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"

      # Banco de dados
      DATABASE_PROVIDER: "postgresql"
      DATABASE_CONNECTION_URI: "postgresql://${POSTGRES_USER:-whatsfrt}:${POSTGRES_PASSWORD:-whatsfrt}@postgres:5432/evolution"
      DATABASE_CONNECTION_LIMIT: "20"
      DATABASE_CONNECTION_CLIENT_NAME: "EvolutionAPI"
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"

      # Logs
      LOG_LEVEL: "ERROR,WARN,LOG,DEBUG,INFO,VERBOSE"
      LOG_COLOR: "true"
      LOG_BAILEYS: "trace"

      # Força Baileys a buscar a versão atual do WA Web dinamicamente (evita 405)
      CONFIG_SESSION_PHONE_CLIENT: Evolution API
      CONFIG_SESSION_PHONE_NAME: Chrome
      CONFIG_SESSION_PHONE_VERSION: ""

      # Desabilitar integrações opcionais
      RABBITMQ_ENABLED: "false"
      WEBSOCKET_ENABLED: "false"
      PUSHER_ENABLED: "false"
      WA_BUSINESS_TOKEN_WEBHOOK: evolution
    volumes:
      - evolution_instances:/evolution/instances
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 1.1.1.1

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
