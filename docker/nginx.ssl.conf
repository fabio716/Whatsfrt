# Evolution API - Porta 8080 (HTTP direto)
server {
    listen 8080;
    server_name frtwhats.com;

    location / {
        proxy_pass http://evolution_api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name frtwhats.com www.frtwhats.com;
    
    # Redirect HTTP to HTTPS
    return 301 https://frtwhats.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.frtwhats.com;
    
    ssl_certificate /etc/letsencrypt/live/frtwhats.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frtwhats.com/privkey.pem;
    
    # Redirect www to non-www
    return 301 https://frtwhats.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name frtwhats.com;

    ssl_certificate /etc/letsencrypt/live/frtwhats.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frtwhats.com/privkey.pem;
    
    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Proxy to Next.js
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy to Evolution API
    location /evolution {
        proxy_pass http://evolution_api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts aumentados para Evolution API
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # WebSocket support
        proxy_buffering off;
    }
}
